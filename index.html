<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTI4IDEySDI5VjE0SDI4VjEyWiIgZmlsbD0iIzFFODhFNSIvPgo8cGF0aCBkPSJNMTYgMTJIMjhWMTRIMTZWMTJaIiBmaWxsPSIjMUU4OEU1Ii8+CjxwYXRoIGQ9Ik0xNiAxNEgxNi44VjE2SDE2VjE0WiIgZmlsbD0iIzFCNzNFNyIvPgo8L3N2Zz4K">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 6px 20px;
            height: 60px;
        }

        .header-links {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-right: 15px;
        }

        .header-links a {
            color: #222;
            text-decoration: none;
            font-size: 13px;
            padding: 5px 10px;
            border-radius: 2px;
            transition: background-color 0.2s;
        }

        .header-links a:hover {
            text-decoration: underline;
        }

        .apps-menu {
            width: 24px;
            height: 24px;
            cursor: pointer;
            margin-right: 15px;
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .apps-menu:hover {
            background-color: rgba(60, 64, 67, 0.08);
        }

        .profile-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4285f4, #34a853);
            border: none;
            cursor: pointer;
            color: white;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            margin-top: -120px;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo img {
            width: 272px;
            height: 92px;
        }

        /* Search Container */
        .search-container {
            position: relative;
            width: 100%;
            max-width: 584px;
            margin-bottom: 30px;
        }

        .search-box {
            width: 100%;
            height: 44px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 45px;
            font-size: 16px;
            outline: none;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .search-box:hover {
            border-color: rgba(223, 225, 229, 0);
            box-shadow: 0 2px 5px 1px rgba(64, 60, 67, 0.16);
        }

        .search-box:focus {
            border-color: rgba(223, 225, 229, 0);
            box-shadow: 0 2px 5px 1px rgba(64, 60, 67, 0.16);
        }

        .search-icon, .voice-icon, .camera-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .search-icon {
            left: 14px;
            opacity: 0.3;
        }

        .voice-icon {
            right: 44px;
        }

        .camera-icon {
            right: 14px;
        }

        /* Buttons */
        .button-container {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .search-btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 0 20px;
            height: 36px;
            cursor: pointer;
            transition: all 0.1s;
            min-width: 54px;
        }

        .search-btn:hover {
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
            background-color: #f1f3f4;
            border: 1px solid #dadce0;
        }

        /* Language */
        .language {
            color: #3c4043;
            font-size: 13px;
            margin-bottom: 40px;
        }

        .language a {
            color: #1a0dab;
            text-decoration: none;
        }

        .language a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            background-color: #f2f2f2;
            border-top: 1px solid #e4e4e4;
        }

        .footer-top {
            padding: 15px 30px;
            border-bottom: 1px solid #e4e4e4;
            color: #70757a;
            font-size: 15px;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        .footer-left, .footer-right {
            display: flex;
            gap: 30px;
            padding: 15px 10px;
        }

        .footer-left a, .footer-right a {
            color: #70757a;
            text-decoration: none;
            font-size: 14px;
        }

        .footer-left a:hover, .footer-right a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 6px 15px;
            }

            .header-links {
                gap: 10px;
            }

            .header-links a {
                font-size: 12px;
                padding: 3px 6px;
            }

            .main {
                padding: 0 15px;
                margin-top: -80px;
            }

            .logo img {
                width: 200px;
                height: 68px;
            }

            .search-container {
                max-width: 90%;
            }

            .button-container {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .footer-bottom {
                flex-direction: column;
                align-items: center;
            }

            .footer-left, .footer-right {
                gap: 20px;
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            .footer-left, .footer-right {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-links">
            <a href="#">Gmail</a>
            <a href="#">Images</a>
        </div>
        <div class="apps-menu" title="Google apps">

            </svg>
        </div>
        <button class="profile-btn" title="Google Account">P</button>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="logo">
            <svg width="272" height="92" viewBox="0 0 272 92">
                <g fill="none" fill-rule="evenodd">
                    <path fill="#4285F4" d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"/>

                    <path fill="#FBBC05" d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.61h9.25zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z"/>

                </g>
            </svg>
        </div>

        <div class="search-container">
            <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path fill="#9aa0a6" d="m19.35 20.35-.71-.71-6.64-6.64a6 6 0 1 1 .71-.71l6.64 6.64.71.71zM4 10a6 6 0 1 0 12 0A6 6 0 0 0 4 10z"/>

                    <circle fill="#4285f4" cx="96.07" cy="104" r="24"/>

                </g>
            </svg>
        </div>

        <div class="button-container">
            <button class="search-btn" type="button" onclick="performSearch()">Google Search</button>
            <button class="search-btn" type="button" onclick="feelingLucky()">I'm Feeling Lucky</button>
        </div>

        <div class="language">
            Google offered in: 
            <a href="#">العربية</a>
            <a href="#">فارسی</a>
            <a href="#">हिन्दी</a>
            <a href="#">اردو</a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-top">
            United Arab Emirates
        </div>
        <div class="footer-bottom">
            <div class="footer-left">
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="footer-right">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </div>

    <script>
        // Search functionality
        function performSearch() {
            const query = document.getElementById('searchBox').value;
            if (query.trim()) {
                // In a real implementation, this would redirect to Google search
                window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
            }
        }

        function feelingLucky() {
            const query = document.getElementById('searchBox').value;
            if (query.trim()) {
                // In a real implementation, this would redirect to the first result
                window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}&btnI=1`, '_blank');
            } else {
                // If no query, just go to Google
                window.open('https://www.google.com', '_blank');
            }
        }

        // Enter key functionality
        document.getElementById('searchBox').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Voice search placeholder functionality
        document.querySelector('.voice-icon').addEventListener('click', function() {
            alert('Voice search functionality would be implemented here');
        });

        // Camera search placeholder functionality
        document.querySelector('.camera-icon').addEventListener('click', function() {
            alert('Image search functionality would be implemented here');
        });

        // Focus on search box when page loads
        window.addEventListener('load', function() {
            document.getElementById('searchBox').focus();
        });
    </script>
</body>
</html>
